# Builds the Kit Go APK (with its bundled PRoot runtime) and publishes it as a
# GitHub Release. This lives here because the APK cannot be produced without the
# 190 MB runtime bundle, and a release is only worth cutting when both the Dart
# code and that bundle were built from the same commit.
#
#   - push a v* tag, or run this workflow by hand
#
# The runtime script defaults to Chinese mirrors; a GitHub runner sits outside
# them, so the official origins are used here instead.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI to build'
        type: choice
        options: [arm64, x64, all]
        default: arm64
      publish:
        description: 'Create/update the GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  # The Aliyun mirrors in settings.gradle.kts are slow and flaky from a US runner
  # (same reason ci.yml sets this).
  DSH_MAVEN_MIRRORS: 0
  # Official origins: the script's defaults (TUNA / npmmirror) are slow from here.
  UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
  UBUNTU_ARCHIVE_AMD64: http://archive.ubuntu.com/ubuntu
  UBUNTU_ARCHIVE_ARM64: http://ports.ubuntu.com/ubuntu-ports
  UBUNTU_DEB_FALLBACK: http://launchpad.net/ubuntu/+archive/primary/+files
  NODE_MIRROR: https://nodejs.org/dist
  NPM_REGISTRY: https://registry.npmjs.org
  PBS_OFFICIAL: https://github.com/astral-sh/python-build-standalone/releases/download

jobs:
  build:
    name: Build ${{ inputs.abi || 'arm64' }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space
        # The runtime work tree, the Gradle cache, the NDK download and the APK
        # together need more than a stock runner leaves free, and ~12 GB of
        # preinstalled toolchains are dead weight here. The Android SDK stays:
        # build-apk.sh compiles libtawcroot.so with it and a release build fails
        # outright when that library cannot be produced.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /opt/microsoft /usr/local/graalvm \
                      /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Tools the runtime build shells out to
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xz-utils zstd gpgv binutils

      - name: Install the NDK the tawcroot library is built against
        # app/android/app/build.gradle.kts uses flutter.ndkVersion (28.2.13676358).
        # The runner's preinstalled NDK is an older major version, and
        # runtime/tawcroot/build.py refuses to build against anything else, which
        # fails a release build outright.
        #
        # sdkmanager is not on PATH on this image, so its location is probed; if
        # cmdline-tools is absent altogether the NDK archive (r28c is 28.2) is
        # unpacked into place instead.
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          sdkmanager_bin="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -n "$sdkmanager_bin" ]; then
            yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --install "ndk;28.2.13676358"
          else
            echo "::warning::cmdline-tools not found under $sdk; unpacking the NDK archive"
            curl -fsSL --retry 3 -o /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
            unzip -q /tmp/ndk.zip -d /tmp/ndk-unpack
            mkdir -p "$sdk/ndk"
            rm -rf "$sdk/ndk/28.2.13676358"
            mv /tmp/ndk-unpack/android-ndk-r28c "$sdk/ndk/28.2.13676358"
          fi
          ls -1 "$sdk/ndk"
          test -f "$sdk/ndk/28.2.13676358/source.properties"
          # The image exports ANDROID_NDK_HOME=<old ndk>, and
          # runtime/tawcroot/build.py prefers that variable over the SDK's ndk/
          # directory, so point it at the one just installed.
          echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache the runtime downloads
        # ~400 MB of base tarball, Node, Python, debs and Termux packages. Keyed on
        # the pins, so bumping a version refetches exactly what changed.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-cache-${{ runner.os }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/rtbuild.py', 'runtime/patches/**', 'runtime/locks/**') }}

      - name: Build the bundled runtime
        run: |
          set -euo pipefail
          abi='${{ inputs.abi || 'arm64' }}'
          if [ "$abi" = all ]; then
            COMPRESS=gz bash runtime/build-runtime.sh arm64-v8a
            COMPRESS=gz bash runtime/build-runtime.sh x86_64
          elif [ "$abi" = x64 ]; then
            COMPRESS=gz bash runtime/build-runtime.sh x86_64
          else
            COMPRESS=gz bash runtime/build-runtime.sh arm64-v8a
          fi

      - name: Flutter dependencies
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Restore the release signing key
        # Without these secrets Gradle falls back to the debug key (still
        # installable, but every future build would have to keep using it).
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::KEYSTORE_B64 is not set; the APK will be signed with the debug key"
            exit 0
          fi
          ks="$RUNNER_TEMP/kitgo-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          chmod 600 "$ks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ks" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-kitgo}" "$KEYSTORE_PASSWORD" \
            > app/android/key.properties
          chmod 600 app/android/key.properties
          keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" | grep -E "kitgo|Alias" || true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build the APK
        run: |
          set -euo pipefail
          abi='${{ inputs.abi || 'arm64' }}'
          # The demo key is a build-time default for throwaway builds; a published
          # APK must not ship it, so it is blanked here.
          if [ "$abi" = all ]; then
            bash tooling/build-apk.sh --release -f all --keep-daemon -- --dart-define=KIT_DEMO_API_KEY=
          else
            bash tooling/build-apk.sh --release -f "$abi" --keep-daemon -- --dart-define=KIT_DEMO_API_KEY=
          fi

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(sed -nE 's/^version: *([0-9.]+)\+.*/\1/p' app/pubspec.yaml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            name="kitgo-${version}-$(basename "$apk" .apk | sed 's/^app-//; s/-release$//').apk"
            cp "$apk" "dist/$name"
            (cd dist && sha256sum "$name" > "$name.sha256")
            ls -lh "dist/$name"
          done
          cat dist/*.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitgo-apk-${{ inputs.abi || 'arm64' }}
          path: dist/*
          retention-days: 30

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v${VERSION}" ;; esac
          notes="Kit Go ${VERSION} · DSH Go 维吾尔语版 / ئۇيغۇرچە نۇسخىسى

          - 包名 \`can.losfer.dshgo\`，内置 PRoot 运行时（Ubuntu 24.04 + Node + DSH）
          - AI 接口：LOSFER AI \`https://api.losfer.cn/v1\`（仅 API Key）
          - 语言：简体中文 / English / ئۇيغۇرچە（UKIJ Tuz）
          - 更新与社区：本仓库 Releases 与 Discussions

          安装前请核对同名的 \`.sha256\` 文件。"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Kit Go ${VERSION}" --notes "$notes" --target "$GITHUB_SHA"
          fi
